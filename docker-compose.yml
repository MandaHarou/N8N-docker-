services:
  n8n:
    image: n8nio/n8n
    container_name: n8n
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      # --- Sécurité ---
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}

      # --- Identité et URLs publiques ---
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=${N8N_PORT}
      - N8N_PROTOCOL=${N8N_PROTOCOL}
      - WEBHOOK_URL=${WEBHOOK_URL}

      # --- CORS restreint ---
      - N8N_CORS_ALLOW_ORIGIN=${N8N_CORS_ALLOW_ORIGIN}
      - N8N_CORS_ALLOW_METHODS=${N8N_CORS_ALLOW_METHODS}
      - N8N_CORS_ALLOW_HEADERS=${N8N_CORS_ALLOW_HEADERS}
    volumes:
      - ~/.n8n:/home/node/.n8n
    restart: unless-stopped
    env_file:
      - .env